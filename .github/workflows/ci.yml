name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency audit
        run: pnpm audit --audit-level=high

      - name: Format Check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: API Documentation Drift Check
        run: pnpm docs:api:check

      - name: Test
        run: pnpm test

      - name: Benchmark Regression Gate
        run: pnpm bench:ci

      - name: Upload Benchmark Report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: benchmark-report
          path: benchmarks/last-ci-report.json
          if-no-files-found: ignore

      - name: Build
        run: pnpm build

      - name: Bundle Size Gate
        run: pnpm bundle:size

  product-matrix:
    name: ${{ matrix.surface }} gate
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - surface: core
            command: pnpm coverage:core
            needsChrome: false
          - surface: share
            command: pnpm --filter @webblackbox/share-server e2e:share
            needsChrome: false
          - surface: player
            command: pnpm --filter @webblackbox/player e2e:playback
            needsChrome: true
          - surface: player-pressure
            command: pnpm --filter @webblackbox/player-sdk test:pressure
            needsChrome: false
          - surface: lite
            command: pnpm --filter @webblackbox/extension e2e:realworld:ci
            needsChrome: true
          - surface: lite-perf
            command: pnpm --filter @webblackbox/extension e2e:perf:lite:ci
            needsChrome: true
          - surface: full
            command: pnpm --filter @webblackbox/extension e2e:fullchain:full
            needsChrome: true
          - surface: full-memory
            command: pnpm --filter @webblackbox/extension e2e:memory:full:ci
            needsChrome: true
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Chrome for Testing
        if: ${{ matrix.needsChrome }}
        timeout-minutes: 5
        id: setup-chrome
        uses: browser-actions/setup-chrome@2e1d749697dd1612b833dba4a722266286fbefcd # v2.1.2
        with:
          chrome-version: stable
          install-dependencies: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace
        run: pnpm build

      - name: Product surface gate (${{ matrix.surface }})
        env:
          WB_E2E_CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
          WB_E2E_HEADLESS: "1"
          WB_E2E_USE_POPUP_UI: "0"
        run: ${{ matrix.command }}
